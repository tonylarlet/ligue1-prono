name: Mise à jour pronostics

on:
  schedule:
    - cron: "0 6 * * 2"      # chaque mardi 06:00 UTC (~08:00 Paris)
  workflow_dispatch: {}        # bouton "Run workflow" = mise à jour à la demande

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Générer les pronostics
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python -m src.predict
          python -m src.build_site
      - name: Publier
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/predictions.json docs/index.html
          git diff --staged --quiet || git commit -m "Pronos L1 $(date -u +%Y-%m-%d)"
          git push
